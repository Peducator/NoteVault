name: NoteVault CI Pipeline

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # 1. GITLEAKS: Quét phát hiện lộ lọt Secrets, Passwords & API Keys
  # =========================================================================
  gitleaks:
    name: Gitleaks (Secret Detection)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false

  # =========================================================================
  # 2. SEMGREP: Quét tĩnh mã nguồn (SAST) phát hiện lỗ hổng bảo mật
  # =========================================================================
  semgrep:
    name: Semgrep (SAST Security Scan)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Semgrep Scan
        run: |
          semgrep scan --config auto --error --exclude="node_modules" --exclude=".next" --exclude=".docker-data"

  # =========================================================================
  # 3. ESLINT: Kiểm tra chuẩn code & cú pháp (Frontend & Backend)
  # =========================================================================
  eslint:
    name: ESLint (Code Quality & Standards)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Frontend ESLint
        run: |
          cd frontend
          npm run lint

  # =========================================================================
  # 4. NPM TEST: Chạy toàn bộ Test Suites (Jest, Prisma, Redis, Controllers)
  # =========================================================================
  test:
    name: NPM Test (Unit & Integration Suites)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: frobez_user
          POSTGRES_PASSWORD: frobez_password
          POSTGRES_DB: notevault_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: Sync Database Schema (Prisma db push)
        run: |
          cd backend
          npx prisma db push --accept-data-loss
        env:
          DATABASE_URL: postgresql://frobez_user:frobez_password@localhost:5432/notevault_test

      - name: Run Backend Test Suites
        run: |
          cd backend
          npm test
        env:
          DATABASE_URL: postgresql://frobez_user:frobez_password@localhost:5432/notevault_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: ci_test_jwt_secret_key_2026
          JWT_REFRESH_SECRET: ci_test_jwt_refresh_secret_key_2026
          BUCKET_NAME: notevault-bucket-test
          AWS_REGION: ap-southeast-1

  # =========================================================================
  # 5. CI-OK: Chốt an toàn kiểm tra tổng hợp tất cả các job đã PASS
  # =========================================================================
  ci-ok:
    name: ci-ok (All Checks Passed)
    runs-on: ubuntu-latest
    needs: [gitleaks, semgrep, eslint, test]
    if: always()
    steps:
      - name: Evaluate Upstream Job Results
        run: |
          echo "=============================================="
          echo "      NOTEVAULT CI PIPELINE VERIFICATION      "
          echo "=============================================="
          echo "Gitleaks (Secret Scan) : ${{ needs.gitleaks.result }}"
          echo "Semgrep (SAST Scan)    : ${{ needs.semgrep.result }}"
          echo "ESLint (Code Quality)  : ${{ needs.eslint.result }}"
          echo "NPM Test (Jest Suites) : ${{ needs.test.result }}"
          echo "=============================================="

          failed=0
          for job in "${{ needs.gitleaks.result }}" "${{ needs.semgrep.result }}" "${{ needs.eslint.result }}" "${{ needs.test.result }}"; do
            if [ "$job" != "success" ]; then
              failed=1
            fi
          done

          if [ $failed -ne 0 ]; then
            echo "❌ CI FAILED: Có ít nhất một bước kiểm thử không vượt qua."
            exit 1
          fi

          echo "✅ CI-OK PASSED: Tất cả các bước (gitleaks, semgrep, eslint, npm test) đều đạt 100%!"
