services:
  # =========================================================================
  # 1. Reverse Proxy (Nginx) - Điểm tiếp nhận traffic duy nhất từ bên ngoài
  # =========================================================================
  nginx:
    image: nginx:1.25-alpine
    container_name: notevault-nginx-staging
    restart: always
    ports:
      - "${STAGING_PORT:-80}:80"
    volumes:
      - ./nginx/staging.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - notevault-staging-net

  # =========================================================================
  # 2. Redis - In-memory Cache, Token Blacklist & Concurrency Locks
  # =========================================================================
  redis:
    image: redis:7-alpine
    container_name: notevault-redis-staging
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${STAGING_REDIS_PORT:-6380}:6379"
    volumes:
      - notevault-staging-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - notevault-staging-net

  # =========================================================================
  # 3. PostgreSQL Database
  # =========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: notevault-postgres-staging
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-frobez_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-frobez_password}
      POSTGRES_DB: ${POSTGRES_DB:-notevault_staging}
    ports:
      - "${STAGING_DB_PORT:-5433}:5432"
    volumes:
      - notevault-staging-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-frobez_user} -d ${POSTGRES_DB:-notevault_staging}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - notevault-staging-net

  # =========================================================================
  # 4. Backend (Express Node.js API Service - STAGING)
  # =========================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.staging
      target: staging
    container_name: notevault-backend-staging
    restart: always
    environment:
      NODE_ENV: staging
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-frobez_user}:${POSTGRES_PASSWORD:-frobez_password}@postgres:5432/${POSTGRES_DB:-notevault_staging}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-notevault_staging_jwt_secret_key_2026_super_secure}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-notevault_staging_jwt_refresh_secret_key_2026_super_secure}
      BUCKET_NAME: ${BUCKET_NAME:-notevault-bucket-staging}
      AWS_REGION: ${AWS_REGION:-ap-southeast-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-staging_dummy_key}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-staging_dummy_secret}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-lite-latest}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - notevault-staging-net

  # =========================================================================
  # 5. Frontend (Next.js Application Service - STAGING)
  # =========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.staging
      target: staging
      args:
        NEXT_PUBLIC_API_URL: /api
    container_name: notevault-frontend-staging
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
    depends_on:
      - backend
    networks:
      - notevault-staging-net

networks:
  notevault-staging-net:
    driver: bridge

volumes:
  notevault-staging-postgres-data:
  notevault-staging-redis-data: